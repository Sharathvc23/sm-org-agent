[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-member-sdk"
version = "0.1.0"
description = "Client signing surface for federated AI-agent chapters — identity, canonical strings, Ed25519 signatures, headers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "stellarminds.ai" }]
keywords = ["agents", "ed25519", "did", "signing", "conformance"]
dependencies = [
    "cryptography>=42",
    "base58>=2.1",
    "jcs>=0.2",
    # The canonical ARP receipt implementation. Now a published dependency — it
    # was vendored in-tree while sm-arp was private; sm-arp is public on PyPI.
    "sm-arp>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["sm_member_sdk"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
# sm_arp is the third-party sm-arp package, not our code.
known-third-party = ["sm_arp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

# sm-arp ships no py.typed yet, so treat its symbols as untyped at the
# sm_member_sdk boundary rather than failing strict mode.
[[tool.mypy.overrides]]
module = "sm_arp.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-q --cov=sm_member_sdk --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["sm_member_sdk/__init__.py"]
